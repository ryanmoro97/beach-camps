<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Never Not Sandy Camps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <p class="logo">NNS Camps</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="camps.html">Camps</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact &amp; Register</h1>
    <p>Have a question or want to grab a spot? Send me a message and I'll get back to you.</p>

    <!-- email contact form using Formspree -->
    <form id="contact-form" action="https://formspree.io/f/mkjoqpea" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">


      <label for="camp">Camp you're interested in</label>
      <select id="camp" name="camp">
        <option value="">Choose a camp</option>
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <!-- script.js detects and writes error message -->
      <p id="form-error" class="error"></p>

      <button type="submit">Send</button>
    </form>
    <p>Ryan Moro</p>
  </main>

  <footer>
    <p>&copy; 2026 Never Not Sandy Camps &middot; COMP 101 Project 1</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
